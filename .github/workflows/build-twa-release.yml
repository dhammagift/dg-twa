name: Build TWA Release

on:
  push:
    branches:
      - prod
    tags:
      - 'twa-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0

      - name: Update gradle.properties
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x lint
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Build Release APK
        run: ./gradlew app:assembleRelease dict-app:assembleRelease
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Build Release Bundle
        run: ./gradlew app:bundleRelease dict-app:bundleRelease
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"
          SKIP_JDK_VERSION_CHECK: true

      # Same keystore/secrets as the main app — two independent apps sharing one signing key
      # is fine; each still needs its own signing step since the action only signs one directory.
      - name: Sign Dict APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: dict-app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"
          SKIP_JDK_VERSION_CHECK: true

      - name: List APK files
        run: find . -path "*/build/outputs/*" -name "*.apk" -type f

      # Both modules' unsigned/signed outputs already land under distinct module-named
      # directories (app/... vs dict-app/...) so there's no filename collision, but rename to
      # human-readable names for the release page anyway.
      - name: Rename release artifacts
        run: |
          mv app/build/outputs/apk/release/*-signed.apk app/build/outputs/apk/release/dhamma-gift-release.apk
          mv app/build/outputs/bundle/release/*.aab app/build/outputs/bundle/release/dhamma-gift-release.aab
          mv dict-app/build/outputs/apk/release/*-signed.apk dict-app/build/outputs/apk/release/dict-dhamma-gift-release.apk
          mv dict-app/build/outputs/bundle/release/*.aab dict-app/build/outputs/bundle/release/dict-dhamma-gift-release.aab

      # actions/upload-artifact's zip download is broken in mobile browsers (GitHub-side JS/auth
      # quirk, not fixable from here) — a Release asset is a plain direct-download link that works
      # everywhere, so every build (tag or prod-branch push) gets one. A prod-branch push updates
      # a rolling "prod-latest" pre-release instead of a new tag each time.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'prod-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Prod (latest build)' }}
          files: |
            app/build/outputs/apk/release/dhamma-gift-release.apk
            app/build/outputs/bundle/release/dhamma-gift-release.aab
            dict-app/build/outputs/apk/release/dict-dhamma-gift-release.apk
            dict-app/build/outputs/bundle/release/dict-dhamma-gift-release.aab
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          token: ${{ secrets.GITHUB_TOKEN }}
