name: Build TWA Release

on:
  # A tag builds. Run workflow builds. A push does not.
  #
  # Every push to main used to build AND publish: the Create Release step below
  # refreshes the rolling "latest" release on each run, so a one-line fix republished the APK
  # and the AAB. Work in progress does not need a build; it needs one when
  # someone asks, and that is what Run workflow is (owner, 2026-09-20: "не любой же пуш" — and,
  # on a README fix, "зачем сборка"). Same change as dg-app-full's build-app.yml.
  push:
    tags:
      - 'twa-v*'
  workflow_dispatch:
    inputs:
      publish_dict:
        description: 'Upload the DICTIONARY app (gift.dhamma.pali) to the Play internal track — testers only, production still needs a promote. versionCode is read from Play and bumped automatically; nothing to edit first.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the legacy "tools" package, which Google has
          # dropped from the SDK repository (sdkmanager: "Failed to find package 'tools'"), so the
          # step failed. Install only what the build needs.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Update gradle.properties
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decoded once, used by both modules' signingConfig (see app/build.gradle) — signs APK *and*
      # AAB natively through Gradle. The previous approach (r0adkll/sign-android-release) only ever
      # signed *.apk in its target directory; every .aab shipped unsigned and Play Console rejected
      # it ("AAB is not signed"). RELEASE_KEYSTORE_PATH etc. are absent for any run without these
      # secrets (e.g. a fork), and both build.gradle files fall back to an unsigned build in that case.
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # Play refuses a versionCode it has already seen (the exact failure this replaces: run
      # 106185540409 uploaded dict-app with the hardcoded `versionCode 2` from build.gradle, and
      # Play already had a release at 2 — "Version code 2 has already been used", fixable before
      # only by hand-editing build.gradle ahead of every dispatch). Queried instead: an Edit against
      # gift.dhamma.pali lists every track's releases, each with its own versionCodes; the highest
      # one seen across ALL tracks (Play's own rule — codes are unique per app, not per track) plus
      # one is what this build gets. A brand new app with no releases yet answers with no tracks
      # data at all, which the script reads as max 0, so the first-ever upload still gets a real
      # versionCode (1) instead of erroring on an empty list.
      #
      # The token is a plain RFC 7523 JWT-bearer exchange against oauth2.googleapis.com, signed
      # with the service account's own private key — not google-github-actions/auth's
      # token_format: access_token, which (run 38's actual failure) calls the IAM Service Account
      # Credentials API to mint the token and errors with SERVICE_DISABLED when that API is off for
      # the GCP project, a console setting nobody had asked to change. r0adkll/upload-google-play
      # never needed it either — it authenticates the AAB upload below with this same JSON directly.
      #
      # `secrets` cannot be read inside a step's `if:` (that alone invalidates the whole workflow
      # file — GitHub rejects it before scheduling a single job, "startup_failure" with zero jobs to
      # show for it, runs 35/36) — hence env: here and a plain `if: github.event_name == ...`.
      - name: Bump dict-app versionCode past what Play has already seen
        if: github.event_name == 'workflow_dispatch' && inputs.publish_dict
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "no PLAY_SERVICE_ACCOUNT_JSON — leaving dict-app/build.gradle's versionCode as is"
            exit 0
          fi
          node <<'NODE'
          const crypto = require('crypto');
          const https = require('https');
          const fs = require('fs');

          const key = JSON.parse(process.env.PLAY_JSON);
          const now = Math.floor(Date.now() / 1000);
          const b64url = (obj) => Buffer.from(JSON.stringify(obj)).toString('base64url');
          const unsigned = b64url({ alg: 'RS256', typ: 'JWT' }) + '.' + b64url({
            iss: key.client_email,
            scope: 'https://www.googleapis.com/auth/androidpublisher',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600,
          });
          const jwt = unsigned + '.' + crypto.createSign('RSA-SHA256').update(unsigned).sign(key.private_key).toString('base64url');

          function request(options, body) {
            return new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', (c) => { data += c; });
                res.on('end', () => resolve({ status: res.statusCode, body: data }));
              });
              req.on('error', reject);
              if (body) req.write(body);
              req.end();
            });
          }
          function api(method, path, token) {
            return request({ hostname: 'androidpublisher.googleapis.com', path, method, headers: { Authorization: 'Bearer ' + token } });
          }
          function fail(step, res) {
            console.error(`${step} failed (HTTP ${res.status}):`, res.body);
            process.exit(1);
          }

          (async () => {
            const form = new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion: jwt,
            }).toString();
            const tokenRes = await request(
              { hostname: 'oauth2.googleapis.com', path: '/token', method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Content-Length': Buffer.byteLength(form) } },
              form);
            const token = JSON.parse(tokenRes.body || '{}').access_token;
            if (!token) fail('token exchange', tokenRes);

            const pkg = 'gift.dhamma.pali';
            const editRes = await api('POST', `/androidpublisher/v3/applications/${pkg}/edits`, token);
            const edit = JSON.parse(editRes.body || '{}');
            if (!edit.id) fail('opening an edit', editRes);

            const tracksRes = await api('GET', `/androidpublisher/v3/applications/${pkg}/edits/${edit.id}/tracks`, token);
            if (tracksRes.status >= 300) fail('listing tracks', tracksRes);
            const tracks = JSON.parse(tracksRes.body || '{}').tracks || [];
            let max = 0;
            for (const t of tracks) for (const r of (t.releases || [])) for (const v of (r.versionCodes || []))
              max = Math.max(max, parseInt(v, 10) || 0);

            await api('DELETE', `/androidpublisher/v3/applications/${pkg}/edits/${edit.id}`, token);

            const next = max + 1;
            console.log(`Play's highest known ${pkg} versionCode is ${max}; building ${next}`);
            const gradle = fs.readFileSync('dict-app/build.gradle', 'utf8');
            fs.writeFileSync('dict-app/build.gradle', gradle.replace(/versionCode \d+/, `versionCode ${next}`));
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE

      - name: Build with Gradle
        run: ./gradlew build -x lint
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Build Release APK
        run: ./gradlew app:assembleRelease dict-app:assembleRelease
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Build Release Bundle
        run: ./gradlew app:bundleRelease dict-app:bundleRelease
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: List APK/AAB files
        run: find . -path "*/build/outputs/*" \( -name "*.apk" -o -name "*.aab" \) -type f

      # Both modules' outputs already land under distinct module-named directories
      # (app/... vs dict-app/...) so there's no filename collision, but rename to
      # human-readable names for the release page anyway.
      - name: Rename release artifacts
        run: |
          mv app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/dhamma-gift.apk
          mv app/build/outputs/bundle/release/*.aab app/build/outputs/bundle/release/dhamma-gift.aab
          mv dict-app/build/outputs/apk/release/*.apk dict-app/build/outputs/apk/release/dict-dhamma-gift.apk
          mv dict-app/build/outputs/bundle/release/*.aab dict-app/build/outputs/bundle/release/dict-dhamma-gift.aab

      # actions/upload-artifact's zip download is broken in mobile browsers (GitHub-side JS/auth
      # quirk, not fixable from here) — a Release asset is a plain direct-download link that works
      # everywhere, so every build gets one. A push to `main` (the only release branch; `prod` was retired 2026-09-15) updates the
      # rolling "latest" release; anything else non-tag (workflow_dispatch on a scratch
      # branch, e.g. for a one-off test.dhamma.gift build) goes to a separate rolling "test-latest"
      # instead — this used to be "anything non-tag" -> latest, which meant a manual dispatch
      # on any other branch silently clobbered the real release.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.ref == 'refs/heads/main' && 'latest' || 'test-latest') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.ref == 'refs/heads/main' && 'Latest build' || format('Test build ({0})', github.ref_name)) }}
          files: |
            app/build/outputs/apk/release/dhamma-gift.apk
            app/build/outputs/bundle/release/dhamma-gift.aab
            dict-app/build/outputs/apk/release/dict-dhamma-gift.apk
            dict-app/build/outputs/bundle/release/dict-dhamma-gift.aab
          draft: false
          prerelease: ${{ !(startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Dormant until the secret exists: no service account, no upload, and the job summary says
      # so — a green tick that uploaded nothing is the worst thing a release pipeline can do.
      # The same service account as dg-app-full; it already holds rights on this app. The owner's
      # account is a USER, not an organisation, so there is no shared-secret option to reach for:
      # the same JSON goes into this repository's own secrets, under this exact name. Setup:
      # dg-app-full/docs/ANDROID_RELEASE.md.
      - name: Is the Play service account there?
        id: play
        if: github.event_name == 'workflow_dispatch' && inputs.publish_dict
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
            echo "service account present"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set - nothing was uploaded to Play."
            {
              echo "### Play upload: nothing happened"
              echo ""
              echo "Missing repository secret \`PLAY_SERVICE_ACCOUNT_JSON\` - Settings -> Secrets and variables -> Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ONLY dict-app. The other module in this repository declares gift.dhamma.twa, which is the
      # package dg-app-full now ships (the Capacitor app replaced the TWA listing) — two
      # repositories able to push one package means finding out in the console whose versionCode
      # won. Its AAB stays a GitHub release asset and nothing more.
      #
      # Deliberately not on a tag, unlike dg-app-full: a `twa-v*` tag here has always meant "cut a
      # GitHub release", and quietly giving an existing tag a second, store-facing meaning is how
      # someone ships something they did not mean to. Tick the box.
      - name: Upload the dictionary app to Google Play
        if: steps.play.outputs.have == 'yes'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: gift.dhamma.pali
          releaseFiles: dict-app/build/outputs/bundle/release/dict-dhamma-gift.aab
          track: internal
          status: completed

      - name: Say what went to Play
        if: success() && steps.play.outputs.have == 'yes'
        run: |
          {
            echo "### Dictionary app uploaded"
            echo ""
            echo "\`gift.dhamma.pali\` is on the **internal** track. Production needs a promote in the Play Console."
          } >> "$GITHUB_STEP_SUMMARY"
